# --- 5. Justificativa da contratação --------------------------------------
  - id: PB-05-001
    secao: "5 - Justificativa da Contratação"
    titulo: "Motivo da contratação (histórico e necessidade)"
    descricao: >-
      Apresentar o motivo da contratação: breve histórico e necessidade,
      podendo abordar vinculação ao PE/PDTI/PETI, interesses de clientes,
      viabilidade econômica (inclusive cobertura por contratos de receita),
      requisitos de contratação, plano de sustentação, estratégia de
      contratação, vedações, obrigações, riscos e resultados esperados.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "justificativa da contrata[cç][aã]o|necessidade da contrata[cç][aã]o"
    orientacao: "Desenvolver a seção 5 com histórico, necessidade e resultados esperados."

  - id: PB-05-002
    secao: "5 - Justificativa da Contratação"
    titulo: "Vinculação ao PE, PDTI e PETI"
    descricao: "Demonstrar vinculação ao Planejamento Estratégico, PDTI e PETI."
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "planejamento estrat[eé]gico|\\bPDTI\\b|\\bPETI\\b|\\bPE\\b"
    orientacao: "Indicar objetivo/iniciativa do PE, PDTI ou PETI atendido pela contratação."

  - id: PB-05-003
    secao: "5 - Justificativa da Contratação"
    titulo: "Consequências da não contratação"
    descricao: "Descrever as consequências da não contratação."
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "(consequ[eê]ncias?|impactos?|riscos?) da n[aã]o contrata[cç][aã]o|n[aã]o (efetiva[cç][aã]o|realiza[cç][aã]o) da contrata[cç][aã]o|caso a contrata[cç][aã]o n[aã]o (se )?(ocorra|efetive)"
    orientacao: "Acrescentar parágrafo sobre os impactos da não contratação."

  - id: PB-05-004
    secao: "5 - Justificativa da Contratação"
    titulo: "Justificativa da quantidade"
    descricao: "Justificar as quantidades contratadas."
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "justificativa (da|das) quantidade|dimensionamento .{0,30}quantidad|mem[oó]ria de c[aá]lculo"
    orientacao: >-
      Apresentar memória de cálculo/dimensionamento que sustente cada
      quantidade solicitada.

  - id: PB-05-005
    secao: "5 - Justificativa da Contratação"
    titulo: "Histórico de contratos anteriores com comparativo de preços"
    descricao: >-
      Histórico de contratos anteriores (RG, fornecedor, objeto e vigência),
      com comparativo de preços e destaque para as principais diferenças de
      especificação e quantidade em relação à contratação atual, acompanhado de
      justificativas técnicas para eventuais variações.
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "contrat(o|os|a[cç][oõ]es) anterior|hist[oó]rico de contrat|\\bRG\\s*\\d"
    orientacao: >-
      Incluir tabela com RG, fornecedor, objeto, vigência e preço dos contratos
      anteriores, com justificativa técnica das variações.

  - id: PB-05-006
    secao: "5 - Justificativa da Contratação"
    titulo: "Justificativa da exigência de garantia de execução"
    descricao: "Quando for o caso, justificar a exigência de garantia de execução."
    aplicabilidade: [garantia_execucao]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "garantia de execu[cç][aã]o"
    orientacao: "Justificar a exigência e o percentual da garantia de execução."

  - id: PB-05-007
    secao: "5 - Justificativa da Contratação"
    titulo: "Consultoria: fundamentação da necessidade com indicadores (5.1)"
    descricao: >-
      Apresentar a fundamentação da necessidade com descrição do cenário atual
      ou do problema, dados de eficiência operacional, indicadores de
      conformidade e governança, índice de satisfação de clientes, impacto
      financeiro ou outros indicadores, bem como os resultados pretendidos,
      permitindo avaliar a efetividade da implementação dos produtos.
    aplicabilidade: [consultoria]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "cen[aá]rio atual|indicador|efici[eê]ncia operacional"
    orientacao: >-
      Complementar a seção 5 com indicadores mensuráveis do cenário atual e dos
      resultados esperados (Justificativas Obrigatórias de consultoria, 5.1).

  - id: PB-05-008
    secao: "5 - Justificativa da Contratação"
    titulo: "Consultoria: fundamentação do modelo de contratação (5.2)"
    descricao: >-
      Fundamentar a definição do modelo de contratação, dos requisitos e dos
      produtos a serem entregues, demonstrando ser a solução mais adequada.
    aplicabilidade: [consultoria]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "modelo de contrata[cç][aã]o|solu[cç][aã]o mais adequada"
    orientacao: "Justificar o modelo de contratação e os produtos definidos."

  - id: PB-05-009
    secao: "5 - Justificativa da Contratação"
    titulo: "Consultoria: comprovação da impossibilidade de execução interna (5.3)"
    descricao: >-
      Comprovar que os serviços não podem ser executados por empregados do
      Serpro, seja pela inexistência ou indisponibilidade de pessoal com as
      competências exigidas, ou pela necessidade imprescindível de um olhar
      externo.
    aplicabilidade: [consultoria]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "n[aã]o pode(m)? ser executad|olhar externo|indisponibilidade de pessoal|corpo t[eé]cnico pr[oó]prio"
    orientacao: >-
      Comprovar a inexistência/indisponibilidade de pessoal próprio ou a
      necessidade de olhar externo.

  - id: PB-05-010
    secao: "5 - Justificativa da Contratação"
    titulo: "Consultoria: estudo sobre contratações anteriores do mesmo tipo (5.4)"
    descricao: >-
      Estudo sobre contratações anteriores da mesma consultoria, informando se
      os produtos foram finalizados e implantados, resultados e conhecimentos
      obtidos, justificando a nova contratação e a ausência de sobreposição por
      contratações sucessivas do mesmo objeto.
    aplicabilidade: [consultoria]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "contrata[cç][oõ]es anteriores|sobreposi[cç][aã]o|contrata[cç][oõ]es sucessivas"
    orientacao: >-
      Demonstrar o resultado das consultorias anteriores e a ausência de
      sobreposição de objeto.

  - id: PB-05-011
    secao: "5 - Justificativa da Contratação"
    titulo: "Consultoria: alinhamento com o planejamento do Serpro (5.5)"
    descricao: >-
      Demonstrar o alinhamento da contratação com o planejamento estratégico,
      de negócio ou de tecnologia do Serpro.
    aplicabilidade: [consultoria]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "planejamento (estrat[eé]gico|de neg[oó]cio|de tecnologia)"
    orientacao: "Vincular a consultoria ao planejamento corporativo."

