    verificacao: presenca
    gatilhos:
      - "cat[aá]logo de (solu[cç][oõ]es de )?TIC|\\bMGI\\b|\\bSGD\\b"
    orientacao: >-
      Registrar a consulta ao Catálogo de TIC do MGI (ou justificar a
      inexistência do item no catálogo).

  - id: PB-07-003
    secao: "7 - Justificativa para Aceitação de Preços"
    titulo: "Preços com entes públicos ou justificativa e comprovações"
    descricao: >-
      Caso a pesquisa não contenha preços com entes públicos, solicitar
      justificativa e comprovações (prints de pesquisa no Banco de Preços ou
      Comprasnet).
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: coerencia
    gatilhos:
      - "ente(s)? p[uú]blico|banco de pre[cç]os|comprasnet|\\bPNCP\\b|painel de pre[cç]os"
    orientacao: >-
      Incluir preços praticados com entes públicos ou justificar a ausência,
      anexando as comprovações da pesquisa.

  - id: PB-07-004
    secao: "7 - Justificativa para Aceitação de Preços"
    titulo: "Declaração de vantajosidade em compra direta"
    descricao: >-
      Em compra direta, declarar que o preço proposto pela empresa ao Serpro é
      vantajoso economicamente.
    aplicabilidade: [contratacao_direta, inexigibilidade]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "vantajos"
    orientacao: "Inserir a declaração de vantajosidade econômica do preço proposto."

  - id: PB-07-005
    secao: "7 - Justificativa para Aceitação de Preços"
    titulo: "Consultoria: equivalência de qualificação em contratos similares (7.1.1)"
    descricao: >-
      Demonstrar a equivalência direta entre cargos, formação acadêmica,
      experiência profissional e demais requisitos de qualificação exigidos.
    aplicabilidade: [consultoria]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "equival[eê]ncia|forma[cç][aã]o acad[eê]mica|experi[eê]ncia profissional"
    orientacao: "Demonstrar a equivalência de perfis entre a contratação e os paradigmas."

  - id: PB-07-006
    secao: "7 - Justificativa para Aceitação de Preços"
    titulo: "Consultoria: equivalência de dimensionamento/escopo (7.2.2 e 7.2.3)"
    descricao: >-
      Demonstrar a equivalência do dimensionamento e/ou escopo dos serviços a
      serem contratados frente aos avaliados na pesquisa, ou justificar a
      comparação de valores realizada.
    aplicabilidade: [consultoria]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "dimensionamento|escopo .{0,30}equivalen|compara[cç][aã]o de valores"
    orientacao: >-
      Demonstrar a equivalência de escopo/dimensionamento ou justificar a
      comparação adotada.

# --- 8. Gestão contratual --------------------------------------------------
  - id: PB-08-001
    secao: "8 - Gestão Contratual"
    titulo: "Vigência do contrato com prazo e termo inicial"
    descricao: >-
      "O prazo de vigência do contrato será de XX (xis) meses, a partir da data
      de ___/___/_____."
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "prazo de vig[eê]ncia|vig[eê]ncia do contrato"
    orientacao: "Declarar o prazo de vigência em algarismos e por extenso e o termo inicial."

  - id: PB-08-002
    secao: "8 - Gestão Contratual"
    titulo: "Vigência acima de 60 meses exige nota técnica"
    descricao: >-
      Caso a vigência total ultrapasse 60 meses, deve ser anexada nota técnica
      com justificativa, conforme art. 87 do Regulamento (Seção VI - Da Duração
      dos Contratos). Ver PARECER SUPJU 0477/2024.
    aplicabilidade: [vigencia_acima_60]
    severidade: critico
    verificacao: anexo
    gatilhos:
      - "nota t[eé]cnica"
    orientacao: >-
      Anexar nota técnica justificando a duração superior a 60 meses (art. 87
      do Regulamento; Parecer LAA/SUPJU 0477/2024).

  - id: PB-08-003
    secao: "8 - Gestão Contratual"
    titulo: "Prorrogação restrita a serviços contínuos, com itens identificados"
    descricao: >-
      Apenas serviços contínuos podem ser renovados/prorrogados. Se apenas
      alguns itens do PB puderem ser renovados, deixar claro quais.
    aplicabilidade: [servico]
    severidade: critico
    verificacao: coerencia
    gatilhos:
      - "prorrogad|prorroga[cç][aã]o|renova[cç][aã]o"
    orientacao: >-
      Identificar expressamente quais itens são passíveis de prorrogação e
      confirmar sua natureza contínua.

  - id: PB-08-004
    secao: "8 - Gestão Contratual"
    titulo: "Vigência das subscrições distinta da vigência do contrato"
    descricao: >-
      "A vigência das subscrições será de XX (xis) meses a partir do
      recebimento definitivo e não se confunde com a vigência do contrato."
    aplicabilidade: [subscricao]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "vig[eê]ncia das subscri[cç][oõ]es|n[aã]o se confunde com a vig[eê]ncia"
    orientacao: "Incluir cláusula distinguindo a vigência das subscrições da do contrato."

  - id: PB-08-005
    secao: "8 - Gestão Contratual"
    titulo: "Prorrogação por apostilamento para garantia técnica"
    descricao: >-
      Em aquisição com garantia técnica, prever prorrogação pelo período
      necessário para contemplar o prazo da garantia, mediante apostilamento.
    aplicabilidade: [garantia_tecnica]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "apostilamento"
    orientacao: "Incluir a cláusula de prorrogação por apostilamento para a garantia técnica."

  - id: PB-08-006
    secao: "8 - Gestão Contratual"
    titulo: "Prorrogação por apostilamento para execução de serviço vinculado"
    descricao: >-
      Em aquisição com prestação de serviço, prever prorrogação pelo período
      necessário para contemplar o prazo de execução do serviço, mediante
      apostilamento.
    aplicabilidade: [bem, servico]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "apostilamento"
    orientacao: "Incluir a cláusula de prorrogação por apostilamento para o serviço vinculado."

  - id: PB-08-007
    secao: "8 - Gestão Contratual"
    titulo: "Vigência da Ata de Registro de Preços"
    descricao: "Se for o caso, informar a vigência da Ata de Registro de Preços."
    aplicabilidade: [arp]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "ata de registro de pre[cç]os|\\bARP\\b"
    orientacao: "Informar a vigência da ARP."

  - id: PB-08-008
    secao: "8 - Gestão Contratual"
    titulo: "Obrigações do Serpro e da Contratada"
    descricao: "Se for o caso, descrever as obrigações do Serpro e da Contratada."
    aplicabilidade: [sempre]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "obriga[cç][oõ]es d(a|o) contratad|obriga[cç][oõ]es do serpro"
    orientacao: "Incluir o rol de obrigações das partes."

  - id: PB-08-009
    secao: "8 - Gestão Contratual"
    titulo: "Repasse de conhecimento"
    descricao: >-
      Se for o caso, prever repasse de conhecimento; os itens de repasse devem
      ser apreciados pela equipe SUPET/ETECD/ETCSE.
    aplicabilidade: [servico, consultoria]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "repasse de conhecimento|transfer[eê]ncia de conhecimento"
    orientacao: >-
      Descrever o repasse de conhecimento e submeter os itens à apreciação da
      SUPET/ETECD/ETCSE.

# --- 9. Anexos -------------------------------------------------------------
