# ---------------------------------------------------------------------------
# Checklist de Conformidade - Projetos Básicos (PB) e Termos de Referência (TR)
# Fonte normativa: "[TI] Roteiro - Projetos Básicos e Termos de Referência"
# Normas correlatas: LA 002 (Planejamento das Contratações), LA 008 (Contratação),
#                    Lei 13.303/2016, Parecer LAA 0477/2024 (duração do contrato)
#
# Campos de cada regra:
#   id                -> identificador estável (não reaproveitar após remoção)
#   secao             -> seção do PB/TR a que se refere
#   titulo            -> enunciado curto do que se verifica
#   descricao         -> texto integral/parafraseado do roteiro
#   aplicabilidade    -> tags de contexto; "sempre" = incondicional
#   severidade        -> critico | alto | medio | informativo
#   verificacao       -> presenca | numeracao | calculo | anexo | coerencia | manual
#   gatilhos          -> regex (case-insensitive, sem acento sensível) que
#                        evidenciam o atendimento do item no texto do PB
#   orientacao        -> recomendação a constar no relatório quando não conforme
# ---------------------------------------------------------------------------

metadata:
  versao: "1.2.0"
  data_base: "2026-08-19"
  fonte: "[TI] Roteiro - Projetos Básicos e Termos de Referência (1).docx"
  responsavel: "DIRAF/SUPGA/GACON/GACOA - Divisão de Conformidade Administrativa"

# Tags de aplicabilidade reconhecidas pelo motor de regras.
taxonomia_aplicabilidade:
  sempre: "Vale para qualquer PB/TR"
  licitacao: "Contratação por licitação"
  contratacao_direta: "Dispensa / contratação direta"
  inexigibilidade: "Inexigibilidade de licitação"
  servico: "Prestação de serviço"
  bem: "Compra de bens/materiais"
  consultoria: "Serviço de consultoria"
  treinamento: "Cursos e treinamentos"
  ordem_servico: "Contrato com emissão de Ordem de Serviço"
  ordem_fornecimento: "Contrato com emissão de Ordem de Fornecimento"
  chamados: "Contrato com abertura de chamados"
  grupo: "Objeto agrupado (grupos de itens)"
  ativos: "Contratação que gera ativos imobilizados"
  hardware: "Hardware ou preço atrelado a moeda estrangeira"
  subscricao: "Subscrições / licenciamento por período"
  garantia_tecnica: "Aquisição com garantia técnica"
  garantia_execucao: "Exigência de garantia de execução contratual"
  arp: "Ata de Registro de Preços"
  marca_modelo: "Indicação de marca e modelo"
  vigencia_acima_60: "Vigência total superior a 60 meses"
  pagamento_mensal: "Pagamento em parcelas mensais"
  bb_sao_paulo: "Entrega/serviço no endereço do Banco do Brasil em São Paulo"
  rescisao_antecipada: "Previsão de cláusula de rescisão antecipada"
  amostra: "Exigência de amostra"
  atestado_nao_padrao: "Atestado de capacidade técnica fora do padrão"

# ===========================================================================
regras:

# --- 0. Diretrizes gerais e Aba Itens ------------------------------------
  - id: PB-00-001
    secao: "0 - Diretrizes Gerais"
    titulo: "Contratação baseada em Estudo Técnico Preliminar (ETP)"
    descricao: >-
      A contratação deve ser baseada em um Estudo Técnico Preliminar (ETP),
      que deve constar dos anexos com status Finalizado.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "estudo t[eé]cnico preliminar"
      - "\\bETP\\b"
    orientacao: >-
      Referenciar expressamente o ETP que fundamenta a contratação e anexá-lo
      com status Finalizado.

  - id: PB-00-002
    secao: "0 - Diretrizes Gerais"
    titulo: "Vinculação ao Documento de Oficialização da Demanda (DOD)"
    descricao: >-
      A contratação deve estar vinculada a uma necessidade do demandante,
      formalizada em Documento de Oficialização da Demanda.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "documento de oficializa[cç][aã]o da demanda"
      - "\\bDOD\\b"
    orientacao: "Citar o(s) DOD(s) que originaram a demanda e anexá-lo(s)."

  - id: PB-00-003
    secao: "0 - Aba Itens"
    titulo: "Aderência entre a Aba Itens e as quantidades do PB"
    descricao: >-
      Conferir se a quantidade da Aba Itens corresponde à quantidade do PB
      (ex.: quantidades da seção 2; número de meses do serviço).
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: coerencia
    gatilhos: []
    orientacao: >-
      Conferência manual/assistida: a Aba Itens do sistema não integra o PDF.
      Confrontar quantidades por item e o número de meses declarado na vigência.

# --- 1. Objeto -------------------------------------------------------------
  - id: PB-01-001
    secao: "1 - Objeto"
    titulo: "Definição sucinta do objeto"
    descricao: "Contratação: definição sucinta do objeto a ser contratado."
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "^\\s*1[\\.\\s].{0,40}objeto"
      - "contrata[cç][aã]o de"
    orientacao: >-
      Incluir seção 1 com definição sucinta e autoexplicativa do objeto,
      compatível com a especificação detalhada da seção 2.

# --- 2. Especificação do objeto -------------------------------------------
  - id: PB-02-001
    secao: "2 - Especificação do Objeto"
    titulo: "Especificação detalhada e quantidade por localidade"
    descricao: >-
      Descrição detalhada da especificação do objeto e da quantidade
      distribuída por localidade. Conferir a soma das quantidades.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: calculo
    gatilhos:
      - "quantidade"
      - "localidade"
    orientacao: >-
      Detalhar a especificação e distribuir as quantidades por localidade;
      a soma das parcelas deve fechar com o total do item.

  - id: PB-02-002
    secao: "2 - Especificação do Objeto"
    titulo: "Indicação de Itens e Grupos"
    descricao: "Em caso de licitação, indicação dos Itens e Grupos."
    aplicabilidade: [licitacao]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "\\bgrupo\\s*\\d"
      - "\\bitem\\s*\\d"
      - "\\blote\\b"
    orientacao: "Indicar expressamente a composição de itens e grupos do certame."

  - id: PB-02-003
    secao: "2 - Especificação do Objeto"
    titulo: "Dados completos da localidade de entrega/prestação"
    descricao: >-
      Localidade de entrega ou prestação de serviço contendo endereço, CEP,
      CNPJ, inscrição estadual e inscrição municipal.
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "\\bCEP\\b"
      - "\\bCNPJ\\b"
      - "inscri[cç][aã]o estadual"
      - "inscri[cç][aã]o municipal"
    exige_todos_gatilhos: true
    orientacao: >-
      Completar os dados da localidade: endereço, CEP, CNPJ, inscrição
      estadual e inscrição municipal.

  - id: PB-02-004
    secao: "2 - Especificação do Objeto"
    titulo: "Regras e prazo de recebimento conforme cláusulas padrão"
    descricao: >-
      Regras e prazo de recebimento devem seguir as Cláusulas Padrão
      (recebimento provisório e definitivo).
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "recebimento provis[oó]rio"
      - "recebimento definitivo"
    orientacao: >-
      Inserir as cláusulas padrão de recebimento provisório e definitivo
      (arquivo "Cláusulas Padrão").

  - id: PB-02-005
    secao: "2 - Especificação do Objeto"
    titulo: "Prazo de execução do serviço"
    descricao: "Prestação de serviço: indicar o prazo de execução."
    aplicabilidade: [servico]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "prazo de execu[cç][aã]o"
    orientacao: "Declarar o prazo de execução dos serviços."

  - id: PB-02-006
    secao: "2 - Especificação do Objeto"
    titulo: "Cláusulas de Ordem de Serviço"
    descricao: "Em caso de Ordem de Serviço, aplicar as Cláusulas de OS e OF."
    aplicabilidade: [ordem_servico]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "ordem de servi[cç]o"
      - "\\bOS\\b"
    orientacao: "Incluir as cláusulas padrão de Ordem de Serviço."

  - id: PB-02-007
    secao: "2 - Especificação do Objeto"
    titulo: "Materiais acessórios: quantidade, especificação e substituição"
    descricao: >-
      Serviços com disponibilização de materiais acessórios: indicar
      quantidades por localidade, especificação dos materiais e regras de
      substituição quando necessário.
    aplicabilidade: [servico]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "material acess[oó]rio|materiais acess[oó]rios"
      - "substitui[cç][aã]o"
    orientacao: >-
      Detalhar quantidades por localidade, especificação e regra de
      substituição dos materiais acessórios.

  - id: PB-02-008
    secao: "2 - Especificação do Objeto"
    titulo: "Prazo de entrega dos bens"
    descricao: "Compras de bens/materiais: indicar o prazo de entrega."
    aplicabilidade: [bem]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "prazo de entrega"
    orientacao: "Declarar o prazo de entrega dos bens."

  - id: PB-02-009
    secao: "2 - Especificação do Objeto"
    titulo: "Fornecimento único ou parcelado e cronograma de entrega"
    descricao: >-
      Descrever se o fornecimento será de uma só vez ou parceladamente; no
      segundo caso, estabelecer cronograma de entrega com descrição do produto
      e prazos distintos por produto, se for o caso.
    aplicabilidade: [bem]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "parcelad|de uma s[oó] vez|cronograma de entrega"
    orientacao: >-
      Explicitar a forma de fornecimento e, se parcelado, apresentar o
      cronograma de entrega.

  - id: PB-02-010
    secao: "2 - Especificação do Objeto"
    titulo: "Acondicionamento dos produtos"
    descricao: >-
      Descrever o acondicionamento (pacotes, caixas, envelopes, descarregamento
      via website).
    aplicabilidade: [bem]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "acondicionamento|embalagem|pacote|caixa"
    orientacao: "Descrever a forma de acondicionamento/entrega dos produtos."

  - id: PB-02-011
    secao: "2 - Especificação do Objeto"
    titulo: "Cláusulas de Ordem de Fornecimento"
    descricao: "Em caso de Ordem de Fornecimento, aplicar as Cláusulas de OS e OF."
    aplicabilidade: [ordem_fornecimento]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "ordem de fornecimento"
    orientacao: "Incluir as cláusulas padrão de Ordem de Fornecimento."

  - id: PB-02-012
    secao: "2 - Especificação do Objeto"
    titulo: "Consultoria: modo de prestação e apresentação de resultados"
    descricao: >-
      Consultoria: descrever o modo da prestação dos serviços e como serão
      apresentados os resultados.
    aplicabilidade: [consultoria]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "produtos? (a serem )?entregues|entreg[aá]ve|relat[oó]rio final|apresenta[cç][aã]o dos resultados"
    orientacao: >-
      Definir o modo de prestação e a forma de apresentação dos produtos da
      consultoria.

  - id: PB-02-013
    secao: "2 - Especificação do Objeto"
    titulo: "Serviços em equipamentos/softwares instalados: identificação do parque"
    descricao: >-
      Indicar o local, descrever os equipamentos de forma técnica, citar o
      número de patrimônio ou part number e as quantidades.
    aplicabilidade: [servico]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "patrim[oô]nio|part\\s?number|\\bP/N\\b|n[uú]mero de s[eé]rie"
    orientacao: >-
      Identificar tecnicamente os equipamentos/softwares atendidos, com
      patrimônio ou part number, local e quantidades.

  - id: PB-02-014
    secao: "2 - Especificação do Objeto"
    titulo: "Treinamento: conteúdo, carga horária, público, turmas e modalidade"
    descricao: >-
      Cursos e treinamentos devem trazer conteúdo programático, carga horária
      (com cronograma), público-alvo, quantidade de alunos e turmas e a
      modalidade.
    aplicabilidade: [treinamento]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "conte[uú]do program[aá]tico"
      - "carga hor[aá]ria"
      - "p[uú]blico[- ]alvo"
      - "turma"
      - "modalidade"
    exige_todos_gatilhos: true
    orientacao: >-
      Completar a especificação do treinamento: conteúdo programático, carga
      horária/cronograma, público-alvo, nº de alunos e turmas e modalidade.

  - id: PB-02-015
    secao: "2 - Especificação do Objeto"
    titulo: "Serviço iniciado após recebimento definitivo: período estimado"
    descricao: >-
      No caso de serviço iniciando após o recebimento definitivo de licenças ou
      equipamentos, informar que o período de execução é estimado, pois os
      serviços somente serão iniciados e pagos após a emissão do Termo de
      Recebimento Definitivo.
    aplicabilidade: [servico]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "per[ií]odo de execu[cç][aã]o .{0,30}estimad|termo de recebimento definitivo"
    orientacao: >-
      Registrar que o período de execução é estimado e condicionado à emissão
      do Termo de Recebimento Definitivo das licenças/equipamentos.

# --- 3. Níveis de serviço e sancionamentos --------------------------------
  - id: PB-03-001
    secao: "3 - Níveis de Serviço e Sancionamentos"
    titulo: "Padrões de desempenho e qualidade com forma de cálculo"
    descricao: >-
      Estabelecer padrões de desempenho e qualidade contendo definição de
      responsabilidades, forma de cálculo, fato gerador (como obter),
      periodicidade de coleta e prazo de disponibilização.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "n[ií]ve(l|is) de servi[cç]o|\\bSLA\\b|indicador"
      - "forma de c[aá]lculo|f[oó]rmula"
      - "periodicidade"
    exige_todos_gatilhos: true
    orientacao: >-
      Descrever cada indicador com responsável, fórmula de cálculo, fato
      gerador, periodicidade de coleta e prazo de disponibilização.

  - id: PB-03-002
    secao: "3 - Níveis de Serviço e Sancionamentos"
    titulo: "Penalidades objetivas, suficientes e claras"
    descricao: >-
      Prever penalidades de forma objetiva, suficiente e clara. Nos contratos
      com abertura de chamados as penalidades geralmente são cobradas por hora
      ou fração de hora de atraso.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: presenca
    gatilhos:
      - "penalidade|multa|san[cç][aã]o|glosa|ser[aá] descontad|desconto de \\d|descontado(s)? \\d"
    orientacao: >-
      Prever penalidades com base de cálculo, percentual/valor e evento
      gerador definidos objetivamente.

  - id: PB-03-003
    secao: "3 - Níveis de Serviço e Sancionamentos"
    titulo: "Contratos com chamados: conjunto mínimo de parâmetros"
    descricao: >-
      Verificar existência e coerência entre: regime de atendimento; horário de
      atendimento; manutenção em feriados nacionais no caso de 24x7; nível de
      serviço; tempo máximo para início do atendimento; tempo máximo para
      conclusão; canal de abertura de chamados; horário para abertura de
      chamados (distinto do horário de atendimento); entrega de relatórios.
    aplicabilidade: [chamados]
    severidade: critico
    verificacao: coerencia
    gatilhos:
      - "regime de atendimento"
      - "hor[aá]rio de atendimento"
      - "tempo m[aá]ximo para in[ií]cio"
      - "tempo m[aá]ximo para conclus[aã]o"
      - "canal .{0,20}abertura|abertura de chamados"
      - "relat[oó]rio"
    exige_todos_gatilhos: true
    orientacao: >-
      Completar os parâmetros ausentes e verificar coerência entre eles
      (ex.: 24x7 exige definição sobre feriados nacionais; horário de abertura
      de chamados não se confunde com horário de atendimento).

  - id: PB-03-004
    secao: "3 - Níveis de Serviço e Sancionamentos"
    titulo: "Penalidade por atraso na entrega de relatórios"
    descricao: >-
      Quando o relatório for condição para o recebimento definitivo, NÃO prever
      penalidade pelo atraso (a dilação do pagamento já é a penalidade). Quando
      o pagamento ocorrer antes da entrega dos relatórios, prever penalidade
      (valor fixo ou percentual por dia de atraso).
    aplicabilidade: [chamados, servico]
    severidade: alto
    verificacao: coerencia
    gatilhos:
      - "relat[oó]rio"
    orientacao: >-
      Alinhar a existência da penalidade ao momento do pagamento: sem
      penalidade quando o relatório condiciona o recebimento definitivo; com
      penalidade quando o pagamento antecede a entrega.

  - id: PB-03-005
    secao: "3 - Níveis de Serviço e Sancionamentos"
    titulo: "Penalidade por atraso na conclusão de Ordem de Serviço"
    descricao: "Ordem de Serviço: prever penalidade no caso de atraso na conclusão dos serviços."
    aplicabilidade: [ordem_servico]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "atraso .{0,40}conclus[aã]o"
    orientacao: "Incluir penalidade específica para atraso na conclusão da OS."

# --- 4. Valores e forma de pagamento --------------------------------------
  - id: PB-04-001
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Valor total em numeral e por extenso"
    descricao: >-
      Indicar o valor total estimado ou definitivo da contratação, escrevendo-o
      em numeral e por extenso.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: calculo
    gatilhos:
      - "valor (total|global)"
      - "R\\$\\s*[\\d\\.]+,\\d{2}"
    orientacao: >-
      Registrar o valor total em algarismos e por extenso, com conferência de
      equivalência entre as duas formas.

  - id: PB-04-002
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Tabela de preços com Descrição, Quantidade, Valor Unitário e Valor Total"
    descricao: >-
      Tabela com, no mínimo: Descrição, Quantidade, Valor Unitário e Valor
      Total.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: calculo
    gatilhos:
      - "valor unit[aá]rio"
      - "valor total"
      - "quantidade"
    exige_todos_gatilhos: true
    orientacao: >-
      Estruturar a tabela de preços com as quatro colunas mínimas e conferir
      a aritmética (Qtd x Unitário = Total; soma dos totais = valor global).

  - id: PB-04-003
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Valor Total Mensal em pagamentos mensais"
    descricao: "Caso o pagamento seja mensal, a tabela deve conter Valor Total Mensal."
    aplicabilidade: [pagamento_mensal]
    severidade: alto
    verificacao: calculo
    gatilhos:
      - "valor (total )?mensal|mensalidade"
    orientacao: >-
      Acrescentar a coluna/linha de Valor Total Mensal e conferir que
      mensal x nº de meses = valor total do item.

  - id: PB-04-004
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Prazo e forma de pagamento conforme cláusulas padrão"
    descricao: "Especificar prazo e forma de pagamento conforme Cláusulas Padrão."
    aplicabilidade: [sempre]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "formas? (e condi[cç][oõ]es )?de pagamento|prazo de pagamento|condi[cç][oõ]es de pagamento|nota fiscal"
    orientacao: "Inserir as cláusulas padrão de pagamento."

  - id: PB-04-005
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Vedação à antecipação de pagamento"
    descricao: >-
      É vedada a antecipação do pagamento, salvo com justificativas específicas
      e suficientes (seção 5) que resguardem a Administração dos riscos
      inerentes à operação.
    aplicabilidade: [sempre]
    severidade: critico
    verificacao: coerencia
    gatilhos:
      - "antecipa[cç][aã]o (do )?pagamento|pagamento antecipado"
    inverter: true
    orientacao: >-
      Se houver pagamento antecipado, apresentar na seção 5 justificativa
      específica e as medidas de mitigação de risco; caso contrário, suprimir.

  - id: PB-04-006
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Faturamento para a Regional São Paulo (Banco do Brasil/SP)"
    descricao: >-
      Quando houver entrega ou serviço para o endereço do Banco do Brasil em
      São Paulo, incluir cláusula definindo que o faturamento será feito para a
      Regional São Paulo.
    aplicabilidade: [bb_sao_paulo]
    severidade: alto
    verificacao: presenca
    gatilhos:
      - "regional s[aã]o paulo"
    orientacao: "Incluir a cláusula de faturamento pela Regional São Paulo."

  - id: PB-04-007
    secao: "4 - Valores e Forma de Pagamento"
    titulo: "Regras de pró-rata (primeiro e último mês)"
    descricao: >-
      Quando for o caso, prever rateio de 1/30 do valor da contraprestação
      mensal por dia no primeiro e no último mês, com cobrança dos meses
      subsequentes no período de 1 a 30.
    aplicabilidade: [pagamento_mensal]
    severidade: medio
    verificacao: presenca
    gatilhos:
      - "pr[oó][- ]rata|1/30|um trinta avos"
    orientacao: >-
