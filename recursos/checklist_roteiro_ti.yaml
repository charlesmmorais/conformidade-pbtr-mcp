      Nas contratações por inexigibilidade, anexar o documento que comprove a
      inviabilidade de competição.
    aplicabilidade: [inexigibilidade]
    severidade: critico
    verificacao: anexo
    gatilhos:
      - "inviabilidade de competi[cç][aã]o|carta ABES"
    orientacao: "Anexar o documento comprobatório da inviabilidade de competição."
