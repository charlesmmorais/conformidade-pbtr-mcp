# Configuração do Fly.io para o servidor MCP de conformidade de PB/TR.
#
# O endpoint é PÚBLICO por opção: [http_service] expõe a app na internet sem
# autenticação. As travas que tornam isso sustentável estão abaixo — teto de
# upload, teto de análises em memória e limite de concorrência. Ver
# docs/DEPLOY.md.

app = "conformidade-pbtr-mcp"
primary_region = "gru"          # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "http"
  PORT = "8080"
  # Modo remoto: recusa caminhos locais e devolve os relatórios em base64,
  # já que o cliente não compartilha sistema de arquivos com o servidor.
  CONFORMIDADE_PBTR_MODO = "remoto"
  CONFORMIDADE_PBTR_SAIDA = "/tmp/relatorios"
  CONFORMIDADE_PBTR_MAX_UPLOAD_MB = "25"
  # Teto do cache de análises: sem isso, o estado que sobrevive entre as três
  # chamadas do fluxo cresceria até derrubar a instância.
  CONFORMIDADE_PBTR_MAX_ANALISES = "20"
  CONFORMIDADE_PBTR_TTL_MIN = "30"

[http_service]
  # Endpoint público. Para fechar depois, remova esta seção inteira e acesse
  # por Flycast (rede privada da organização).
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # A extração de PDF é o gargalo: concentra CPU por alguns segundos.
    soft_limit = 8
    hard_limit = 16

[[vm]]
  size = "shared-cpu-1x"
  # Sem JVM, o consumo é o do Python mais o PDF em memória. 512 MB atende;
  # suba para 1 GB se for analisar PBs muito grandes em paralelo.
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
