# fly.toml app configuration file generated for conformidade-pbtr on 2026-08-19T23:56:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'conformidade-pbtr'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  CONFORMIDADE_PBTR_MAX_UPLOAD_MB = '25'
  CONFORMIDADE_PBTR_MODO = 'remoto'
  CONFORMIDADE_PBTR_SAIDA = '/tmp/relatorios'
  MCP_TRANSPORT = 'http'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
